name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Determine tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            $env:GITHUB_REF_NAME
          }
          if (-not $tag) { throw "No tag provided." }
          $version = $tag -replace '^v',''
          # Base numeric version (strip anything after the first hyphen).
          $base = ($version -split '-')[0]
          $isPre = $version -match '-'
          "tag=$tag"          >> $env:GITHUB_OUTPUT
          "version=$version"  >> $env:GITHUB_OUTPUT
          "base=$base"        >> $env:GITHUB_OUTPUT
          "prerelease=$($isPre.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "Building $tag (base=$base, prerelease=$isPre)"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'editor-src/package-lock.json'

      - name: Build editor bundle
        working-directory: editor-src
        run: |
          npm ci
          npm run build

      - name: Test editor (JS)
        working-directory: editor-src
        run: npm test

      - name: Restore
        run: dotnet restore MarkdownMidget.slnx

      - name: Test
        run: dotnet test tests/MarkdownMidget.Tests/MarkdownMidget.Tests.csproj -c Release --verbosity minimal

      # MMEEEE: a self-contained single-file exe (no .NET to install), plus a zip of
      # it with the user README and the license. The app's updater looks for the
      # asset ending "-win-x64.exe" (Updates/ReleaseFeed.cs). Unsigned: Markdown
      # Midget's Azure signing belongs to Funcular Labs.
      - name: Publish self-contained
        shell: pwsh
        run: |
          dotnet publish src/MarkdownMidget/MarkdownMidget.csproj `
            -p:PublishProfile=win-x64 `
            -p:Version=${{ steps.tag.outputs.base }} `
            -p:InformationalVersion=${{ steps.tag.outputs.version }} `
            --nologo

      - name: Stage assets
        id: stage
        shell: pwsh
        run: |
          $src = "src/MarkdownMidget/bin/Release/publish/self-contained/MMEEEE.exe"
          if (-not (Test-Path $src)) { throw "Published exe not found at $src" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $tag = "${{ steps.tag.outputs.tag }}"
          $exe = "dist/MMEEEE-$tag-win-x64.exe"
          Copy-Item $src $exe -Force
          $stage = "dist/MMEEEE-$tag"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $src "$stage/MMEEEE.exe"
          Copy-Item src/MarkdownMidget/Tabs/RELEASE-README.md "$stage/README.md"
          Copy-Item LICENSE "$stage/LICENSE"
          $zip = "dist/MMEEEE-$tag-win-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "exe=$exe" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sizeMB=$([Math]::Round((Get-Item $exe).Length / 1MB, 1))" >> $env:GITHUB_OUTPUT

      - name: Build release notes from CHANGELOG
        id: notes
        shell: pwsh
        run: |
          $version = "${{ steps.tag.outputs.version }}"
          $tag = "${{ steps.tag.outputs.tag }}"
          $sizeMB = "${{ steps.stage.outputs.sizeMB }}"
          $repo = "${{ github.repository }}"

          $lines = Get-Content CHANGELOG.md
          $start = -1
          $end = $lines.Count
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($start -lt 0 -and $lines[$i] -match "^##\s+\[$([regex]::Escape($version))\]") {
              $start = $i + 1
              continue
            }
            if ($start -ge 0 -and $lines[$i] -match '^##\s+\[') {
              $end = $i; break
            }
          }
          if ($start -lt 0) {
            Write-Warning "No CHANGELOG entry for [$version]; using generic notes."
            $body = "See [CHANGELOG.md](https://github.com/$repo/blob/master/CHANGELOG.md) for what changed."
          } else {
            $body = ($lines[$start..($end-1)] -join "`n").TrimEnd()
            $body += "`n`nSee [CHANGELOG.md](https://github.com/$repo/blob/master/CHANGELOG.md) for full history."
          }

          $boilerplate = @(
            ''
            '## Download'
            ''
            "- **``MMEEEE-$tag-win-x64.zip``**: the app, a README and the license."
            "- **``MMEEEE-$tag-win-x64.exe``**: just the app (~$sizeMB MB). It's the whole thing: no installer, no .NET to install."
            ''
            '## Requirements'
            ''
            '- **Windows 10/11 (x64)**'
            '- **Microsoft Edge WebView2 Runtime**: already on Windows 11; otherwise a free download from Microsoft.'
            '- **Pandoc** (free), to build books: https://pandoc.org/installing.html or `winget install JohnMacFarlane.Pandoc`'
            '- **Microsoft Word** (optional): fills in a Word build''s contents page and makes PDFs.'
            ''
            '## Notes'
            ''
            '- The exe is not code-signed, so Windows SmartScreen may warn the first time: **More info ▸ Run anyway**.'
            '- Settings live in `%LocalAppData%\EEEE`.'
          ) -join "`n"

          $full = $body + "`n" + $boilerplate
          Set-Content -Path release-notes.md -Value $full -Encoding utf8

      - name: Create GitHub Release
        # Pinned to a commit, not a floating major: it holds a contents:write token
        # and publishes the binaries.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: MMEEEE ${{ steps.tag.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ steps.tag.outputs.prerelease == 'true' }}
          files: |
            ${{ steps.stage.outputs.zip }}
            ${{ steps.stage.outputs.exe }}
          fail_on_unmatched_files: true
